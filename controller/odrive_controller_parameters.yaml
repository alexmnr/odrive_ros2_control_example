odrive_controller:
  joints: {
    type: string_array,
    default_value: [],
    description: "Specifies joints used by the controller",
    read_only: true,
    validation: {
      unique<>: null,
      not_empty<>: null,
    }
  }
  passthrough: {
    type: bool,
    default_value: false,
    description: "If true, no controll logic is implemented and value is simply passed through to hardware interface."
  }
  gains:
    __map_joints:
      position_p: {
        type: double,
        default_value: 0.0,
        description: "Position proportional gain for PID"
      }
      position_i: {
        type: double,
        default_value: 0.0,
        description: "Position integral gain for PID"
      }
      position_d: {
        type: double,
        default_value: 0.0,
        description: "Position serivative gain for PID"
      }
      position_output_max: {
        type: double,
        default_value: .inf,
        description: "Position upper output limit."
      }
      position_output_min: {
        type: double,
        default_value: -.inf,
        description: "Position lower output limit."
      }
      position_i_max: {
        type: double,
        default_value: .inf,
        description: "Position upper integral limit."
      }
      position_i_min: {
        type: double,
        default_value: -.inf,
        description: "Position lower integral limit."
      }
      velocity_p: {
        type: double,
        default_value: 0.0,
        description: "Velocity proportional gain for PID"
      }
      velocity_i: {
        type: double,
        default_value: 0.0,
        description: "Velocity integral gain for PID"
      }
      velocity_d: {
        type: double,
        default_value: 0.0,
        description: "Velocity serivative gain for PID"
      }
      velocity_output_max: {
        type: double,
        default_value: .inf,
        description: "Velocity upper output limit."
      }
      velocity_output_min: {
        type: double,
        default_value: -.inf,
        description: "Velocity lower output limit."
      }
      velocity_i_max: {
        type: double,
        default_value: .inf,
        description: "Velocity upper integral limit."
      }
      velocity_i_min: {
        type: double,
        default_value: -.inf,
        description: "Velocity lower integral limit."
      }
      activate_state_publisher: {
        type: bool,
        default_value: false,
        description: "Individual state publisher activation for each joint. If true, the controller will publish the state of each DOF to the topic `/<controller_name>/<dof_name>/pid_state`."
      }
